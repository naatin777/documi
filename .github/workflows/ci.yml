name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # reviews.json の Git コミット比較 (git show) や --no-review-edit で履歴を参照するため
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests & generate JUnit report
        run: bun test --reporter=junit --reporter-outfile=docs/.documi/test-results.xml

      - name: Typecheck
        run: bun run check

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Knip (unused files & exports)
        run: bun run knip

      - name: Build frontend
        run: bun run build

      - name: Documi living spec check
        run: bun run documi:check
        # 全ブロック承認運用を開始した後は `--strict` を有効化してください:
        # run: bun src/cli.ts check --strict
